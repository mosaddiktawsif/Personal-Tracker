# Local Postgres for the Week 1 project.
# Start:  docker compose up -d
# Stop:   docker compose down          (keeps data)
# Wipe:   docker compose down -v       (deletes the volume — migrations are gone too)

services:
  postgres:
    image: postgres:16-alpine
    container_name: backend-week1-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: backend_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Tests and migrations should only start once Postgres is actually accepting
      # connections, not merely once the container exists.
      test: ["CMD-SHELL", "pg_isready -U app -d backend_dev"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  pgdata:
